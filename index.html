<!doctype html>
<html lang="en">
  <head>
    <link href="https://fonts.google.com/specimen/Figtree" rel="stylesheet" />
    <style>
      body {
        background-color: hsl(47, 88%, 63%);
        display: flex;
        justify-content: center;
      margin-top: 900px;
        align-items: center;
        min-height: 100vh;
        margin: 0 auto;
      }
      .index {
        background-color: white;
        
        width: 375px;
        height: 500px;
        border-radius: 12px;
        box-shadow: 9px 10px 2px  rgb(5, 0, 0);
        border: black 2px solid;
       align-self: center
        ;
      }
      .illustration {
        width: 350px;
        border-radius: 12px;
        height: 200px;
        object-fit: cover;
        margin-top: 20px;
        align-self: center;
        margin-left: 12px;
      }
      .content {
        text-align: center;
        font-family: "Figtree", sans-serif;
        font-weight: 800;
        font-size: 20px;
        text-align: left;
        padding-left: 14px;
      }
      .house {
        text-align: left;
        padding-left: 16px;
        font-family:"Figtree", sans-serif ;
      }
      .different {
        background-color: hsl(47, 88%, 63%);
        text-align: right;
        padding-left: 16px;
      }
      .tag {
        background-color: hsl(47, 88%, 63%);
        padding: 5px 10px;
        border-radius: 5px;
        font-size: 12px;
        display: inline-block;
        margin-left: 20px;
        margin-top: 12px;
        font-weight: bolder;
        font-family: "Figtree", sans-serif ;
      }
      .k {
        color: grey;
        padding-left: 16px;
        padding-right: 40px;
        font-family: "Figtree", sans-serif ;
      }
      .avatar {
        height: 27px;
        width: 27px;
        display: flex;
        margin-left: 18px;
        margin-bottom: 9px;
      }
      .name {
        display: flex;
        margin-top: 4px;
        font-weight:bolder ;
        font-size: small;
        margin-left: 8px;
        font-family:"Figtree", sans-serif 
      }
      .for{
        display: flex;
      }
    </style>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CARD</title>
  </head>
  <body>
    <div class="index">
      <img
        class="illustration"
        src="./assets/images/illustration-article.svg"
      />
      <span class="tag">Learning</span>
      <h5 class="house">Published 21 Dec 2023</h5>
      <h1 class="content">HTML & CSS foundations</h1>
      <p class="k">
        These languages are the backbone of every website, defining structure,
        content, and presentation.
      </p>
      <div class="for">
        <div class="avatar">
          <img src="./assets/images/image-avatar.webp" />
        </div>
        <label form="" class="name">Greg Hooper</label>
      </div>
    </div>
  </body>
</html>
